<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Security Gate | B-Magnet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      background: #090e14;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .gate-card {
      max-width: 400px;
      width: 100%;
      background: rgba(20, 29, 41, 0.95);
      border: 1px solid rgba(45, 155, 136, 0.3);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      backdrop-filter: blur(20px);
    }
    .gate-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(45, 155, 136, 0.15);
      border: 1px solid rgba(45, 155, 136, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2d9b88;
      margin: 0 auto 16px auto;
    }
    .gate-input {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(45, 155, 136, 0.3);
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      text-align: center;
      letter-spacing: 8px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .gate-btn {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00A896, #028090);
      border: none;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,168,150,0.3);
    }
  </style>
</head>
<body>
  <div class="gate-card">
    <div class="gate-icon">
      <span class="material-symbols-rounded" style="font-size: 28px;">admin_panel_settings</span>
    </div>
    <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; margin: 0 0 6px 0; color: #ffffff;">Admin Security Gate</h2>
    <p style="font-size: 13px; color: #94a3b8; margin: 0 0 20px 0;">Enter Master 4-digit PIN to unlock the Admin CRM Portal.</p>
    
    <input type="password" id="gatePin" class="gate-input" maxlength="4" placeholder="••••" autofocus onkeydown="if(event.key==='Enter') checkGatePin();">
    <button type="button" class="gate-btn" onclick="checkGatePin()">Unlock Portal</button>
    <div id="gateError" style="color: #ef4444; font-size: 12px; margin-top: 10px; display: none;">Invalid PIN. Please try again.</div>
    <div style="margin-top: 20px;">
      <a href="/" style="font-size: 12px; color: #64748b; text-decoration: none;">← Return to Main App</a>
    </div>
  </div>

  <script>
    function checkGatePin() {
      const pin = document.getElementById('gatePin').value.trim();
      if (pin === '9633') {
        sessionStorage.setItem('b_admin_session_auth', '9633');
        window.location.href = '/admin/9633/';
      } else {
        document.getElementById('gateError').style.display = 'block';
        document.getElementById('gatePin').value = '';
        document.getElementById('gatePin').focus();
      }
    }
  </script>
</body>
</html>
