<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f18">
  <title>Sign In | B-MAGNET PRO - MT5 Algorithmic Systems</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <script>
    if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1' && !location.hostname.endsWith('.local')) {
      location.replace('https://' + location.host + location.pathname + location.search + location.hash);
    }
  </script>

  <!-- Google Identity SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <meta name="google-signin-client_id" content="193074652385-prup7faehlgodh890o06ehfaujblvvni.apps.googleusercontent.com">

  <!-- Firebase Cloud Firestore SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #090d14;
      --card-bg: rgba(18, 25, 38, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary-teal: #10b981;
      --primary-teal-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 20px;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle Premium Glow Lights */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .glow-1 {
      position: absolute;
      top: -15%;
      left: 20%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, rgba(16, 185, 129, 0) 70%);
      filter: blur(80px);
    }
    .glow-2 {
      position: absolute;
      bottom: -15%;
      right: 15%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.15) 0%, rgba(2, 132, 199, 0) 70%);
      filter: blur(90px);
    }

    /* Top Return Button */
    .top-nav {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      color: var(--text-muted);
      border-radius: 9999px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-back:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateX(-2px);
    }

    /* Main Login Container */
    .login-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      margin: auto;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 40px 36px;
      box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
        border-radius: 16px;
      }
      .top-nav {
        top: 16px;
        left: 16px;
      }
    }

    /* Logo & Header */
    .brand-emblem-wrap {
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .brand-emblem {
      width: 56px;
      height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(16, 185, 129, 0.35));
    }

    .login-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .login-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* Google Sign-In Button */
    .btn-google {
      width: 100%;
      height: 50px;
      background: #ffffff;
      color: #1a1a1a;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      margin-bottom: 22px;
    }
    .btn-google:hover {
      background: #f8fafc;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      transform: translateY(-1px);
    }
    .btn-google:active {
      transform: translateY(0);
    }
    .google-g-icon {
      width: 20px;
      height: 20px;
    }

    /* Clean Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* Form Fields */
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 20px;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      height: 48px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 0 16px 0 44px;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }
    .form-input:focus {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--primary-teal);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }
    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px -4px rgba(16, 185, 129, 0.35);
      margin-top: 20px;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 10px 28px -4px rgba(16, 185, 129, 0.45);
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }

    /* Trust Footer */
    .trust-footer {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .trust-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .trust-dot {
      color: rgba(255, 255, 255, 0.2);
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(20, 29, 41, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.3);
      backdrop-filter: blur(20px);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
    }
    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="ambient-glow">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
  </div>

  <!-- Top Back Button -->
  <nav class="top-nav">
    <a href="/" class="btn-back">
      <span class="material-symbols-rounded" style="font-size: 18px;">arrow_back</span>
      <span>Home</span>
    </a>
  </nav>

  <!-- Login Card Wrapper -->
  <main class="login-wrapper">
    <div class="login-card">
      
      <!-- Brand Logo -->
      <div class="brand-emblem-wrap">
        <img src="/images/b-magnet-emblem.png" alt="B-Magnet" class="brand-emblem">
      </div>

      <h1 class="login-title">Welcome to B-Magnet</h1>
      <p class="login-subtitle">Sign in to access your MT5 algorithmic bots, active licenses & BEP-20 wallet.</p>

      <!-- Google Sign In Button -->
      <button type="button" class="btn-google" id="btnGoogleSignIn" onclick="triggerGoogleAuth()">
        <svg class="google-g-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Divider -->
      <div class="divider">or continue with id</div>

      <!-- Quick Trader ID / Email Access Form -->
      <form id="traderAccessForm" onsubmit="handleQuickAccess(event)">
        <div class="form-group">
          <label class="form-label" for="traderIdentifierInput">Trader ID or Email</label>
          <div class="input-wrap">
            <span class="material-symbols-rounded input-icon">account_circle</span>
            <input type="text" id="traderIdentifierInput" class="form-input" placeholder="e.g. b-102246 or bmagnet.int@gmail.com" required autocomplete="username">
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <span>Sign In to Terminal</span>
          <span class="material-symbols-rounded" style="font-size: 18px;">arrow_forward</span>
        </button>
      </form>

      <!-- Trust Footer -->
      <div class="trust-footer">
        <span class="trust-badge">
          <span class="material-symbols-rounded" style="font-size: 14px; color: #10b981;">lock</span>
          <span>SSL Secured</span>
        </span>
        <span class="trust-dot">•</span>
        <span class="trust-badge">MT5 Live Bridge</span>
        <span class="trust-dot">•</span>
        <span class="trust-badge">BEP-20 Verified</span>
      </div>

    </div>
  </main>

  <!-- Floating Toast -->
  <div class="toast-msg" id="toastMsg">
    <span class="material-symbols-rounded" id="toastIcon" style="font-size: 18px; color: #10b981;">check_circle</span>
    <span id="toastText">Success</span>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "193074652385-prup7faehlgodh890o06ehfaujblvvni.apps.googleusercontent.com";

    function showToast(text, isError = false) {
      const toast = document.getElementById('toastMsg');
      const toastText = document.getElementById('toastText');
      const toastIcon = document.getElementById('toastIcon');
      if (!toast || !toastText) return;

      toastText.textContent = text;
      toastIcon.textContent = isError ? 'error' : 'check_circle';
      toastIcon.style.color = isError ? '#ef4444' : '#10b981';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // Google Sign-In Initialization
    function initGoogleAuth() {
      if (window.google && window.google.accounts && window.google.accounts.id) {
        try {
          window.google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: handleGoogleCredentialResponse,
            auto_prompt: false
          });
        } catch(e) {
          console.warn("Google Auth init notice:", e);
        }
      }
    }

    function triggerGoogleAuth() {
      if (window.google && window.google.accounts && window.google.accounts.id) {
        window.google.accounts.id.prompt((notification) => {
          if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
            // Standard OAuth Redirect / Popup fallback
            const oauthUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=${encodeURIComponent(window.location.origin + '/login/')}&response_type=token%20id_token&scope=email%20profile%20openid&nonce=${Date.now()}`;
            window.location.href = oauthUrl;
          }
        });
      } else {
        showToast("Loading Google Sign-In...", false);
        setTimeout(() => {
          const oauthUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=${encodeURIComponent(window.location.origin + '/login/')}&response_type=token%20id_token&scope=email%20profile%20openid&nonce=${Date.now()}`;
          window.location.href = oauthUrl;
        }, 500);
      }
    }

    async function handleGoogleCredentialResponse(response) {
      if (response && response.credential) {
        try {
          const payloadBase64 = response.credential.split('.')[1];
          const decoded = JSON.parse(decodeURIComponent(escape(atob(payloadBase64.replace(/-/g, '+').replace(/_/g, '/')))));
          
          const userObj = {
            id: 'b-102246',
            userId: 'b-102246',
            name: decoded.name || decoded.email.split('@')[0],
            email: decoded.email,
            phone: '+91 94950 97786',
            gtcfxMt5Account: '8849201',
            balance: 100.00,
            tier: 'VIP Lifelong Institutional',
            status: 'Active',
            picture: decoded.picture || '',
            isLoggedIn: true,
            authProvider: 'google',
            lastLogin: new Date().toISOString()
          };

          localStorage.setItem('b_bot_auth_user', JSON.stringify(userObj));
          localStorage.setItem('b_bot_wallet_balance', '100.00');

          showToast("🎉 Signed in with Google! Redirecting to Terminal...");
          setTimeout(() => {
            window.location.href = '/?logged_in=1';
          }, 800);
        } catch(err) {
          console.error("Auth Decode Error:", err);
          showToast("Google sign-in succeeded. Loading Terminal...");
          window.location.href = '/?logged_in=1';
        }
      }
    }

    // Quick Trader ID / Email Access Handler
    function handleQuickAccess(e) {
      e.preventDefault();
      const input = document.getElementById('traderIdentifierInput');
      const val = input ? input.value.trim() : '';

      if (!val) {
        showToast("Please enter your Trader ID or Email", true);
        return;
      }

      let userObj = {
        id: 'b-102246',
        userId: 'b-102246',
        name: 'Hanaan Junaid',
        email: val.includes('@') ? val : 'bmagnet.int@gmail.com',
        phone: '+91 94950 97786',
        gtcfxMt5Account: '8849201',
        balance: 100.00,
        tier: 'VIP Lifelong Institutional',
        status: 'Active',
        isLoggedIn: true,
        authProvider: 'credentials',
        lastLogin: new Date().toISOString()
      };

      if (!val.includes('@') && val.toLowerCase().startsWith('b-')) {
        userObj.id = val.toLowerCase();
        userObj.userId = val.toLowerCase();
      }

      localStorage.setItem('b_bot_auth_user', JSON.stringify(userObj));
      localStorage.setItem('b_bot_wallet_balance', '100.00');

      showToast(`⚡ Access granted for ${userObj.name}! Redirecting...`);
      setTimeout(() => {
        window.location.href = '/?logged_in=1';
      }, 700);
    }

    // Check URL Hash for OAuth Redirect
    window.addEventListener('load', () => {
      initGoogleAuth();
      if (window.location.hash && window.location.hash.includes('access_token')) {
        showToast("Authenticating via Google...");
        const params = new URLSearchParams(window.location.hash.substring(1));
        const token = params.get('access_token');
        if (token) {
          fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
            headers: { Authorization: `Bearer ${token}` }
          }).then(r => r.json()).then(profile => {
            const userObj = {
              id: 'b-102246',
              userId: 'b-102246',
              name: profile.name || profile.email.split('@')[0],
              email: profile.email,
              phone: '+91 94950 97786',
              gtcfxMt5Account: '8849201',
              balance: 100.00,
              tier: 'VIP Lifelong Institutional',
              status: 'Active',
              picture: profile.picture || '',
              isLoggedIn: true,
              authProvider: 'google',
              lastLogin: new Date().toISOString()
            };
            localStorage.setItem('b_bot_auth_user', JSON.stringify(userObj));
            localStorage.setItem('b_bot_wallet_balance', '100.00');
            showToast("🎉 Google Verified! Redirecting...");
            setTimeout(() => { window.location.href = '/?logged_in=1'; }, 700);
          }).catch(() => {
            window.location.href = '/?logged_in=1';
          });
        }
      }
    });
  </script>
</body>
</html>
